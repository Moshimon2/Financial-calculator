<!doctype html>
<html lang="{{ t.lang }}" data-locale="{{ t.locale }}" data-currency="{{ t.currency }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ t.app.tagline }}{% endblock %} · {{ t.app.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script defer src="{{ url_for('static', path='vendor/htmx-2.0.11.min.js') }}"></script>
  <script defer src="{{ url_for('static', path='vendor/chart-4.6.1.umd.min.js') }}"></script>
  <script defer src="{{ url_for('static', path='js/app.js') }}"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>{{ t.app.name }}</span>
      </a>
      <nav class="nav" aria-label="Fő navigáció">
        {% for key, href in nav %}
          <a href="{{ href }}"{% if page == key %} aria-current="page"{% endif %}>{{ t.nav[key] }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer container">
    <p>{{ t.app.footer }}</p>
  </footer>
</body>
</html>
