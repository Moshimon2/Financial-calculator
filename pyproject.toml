[project]
name = "fincalc"
version = "0.1.0"
description = "Self-hosted financial calculator for Hungarian investors (compound interest, inflation, ETF costs, TBSZ, Lightyear import)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincalc"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "RUF",      # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fincalc"]
plugins = ["pydantic.mypy"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=fincalc --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["fincalc"]

[tool.coverage.report]
fail_under = 90
show_missing = true
